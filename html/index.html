<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - FIT GODS</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo-container">

                <img 
                    src="/assets/logo.png" 
                    alt="Logo de FIT GODS"
                    class="logo-image"
                >

                <h1>FIT GODS</h1>

                <p class="slogan">
                    SUPERA TUS LÍMITES
                </p>

            </div>


            <div class="login-content">

                <h2>Inicia sesión</h2>

                <p class="description">
                    Bienvenido de vuelta, estás a un paso de tu mejor versión.
                </p>


                <form id="loginForm">

                    <div class="input-group">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="Ingresa tu correo"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="password-container">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Ingresa tu contraseña"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                Mostrar
                            </button>

                        </div>

                    </div>


                    <a
                        href="#"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        ¿Olvidaste tu contraseña?
                    </a>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        INICIAR SESIÓN
                    </button>

                </form>


                <p class="register-text">

                    ¿No tienes cuenta?

                    <a href="register.html">
                        Regístrate
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="/js/login.js"></script>

</body>

</html>
