<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil - FIT GODS</title>

    <link rel="stylesheet" href="/css/profile.css">
</head>

<body>

    <header class="top-header">

        <a href="/html/home.html" class="brand">

            <img
                src="/assets/logo.png"
                alt="Logo FIT GODS"
                class="header-logo"
            >

            <span>FIT GODS</span>

        </a>

    </header>


    <main class="profile-container">

        <section class="page-intro">

            <span class="section-label">
                MI CUENTA
            </span>

            <h1>Mi perfil</h1>

            <p>
                Consulta y actualiza tu información personal.
            </p>

        </section>


        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>


            <div class="profile-main-info">

                <h2 id="profileName">
                    
                </h2>

                <p id="profileEmail">
                    correo@ejemplo.com
                </p>

            </div>

        </section>


        <section class="profile-section">

            <div class="section-heading">

                <h2>Información personal</h2>

                <span>
                    Datos de tu cuenta
                </span>

            </div>


            <form id="profileForm">

                <div class="form-row">

                    <div class="input-group">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Nombre"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="apellido">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellido"
                            placeholder="Apellido"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="correo@ejemplo.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="fechaNacimiento">
                        Fecha de nacimiento
                    </label>

                    <input
                        type="date"
                        id="fechaNacimiento"
                    >

                </div>


                <div class="form-row">

                    <div class="input-group">

                        <label for="peso">
                            Peso (kg)
                        </label>

                        <input
                            type="number"
                            id="peso"
                            min="1"
                            max="300"
                            step="0.1"
                            placeholder="Ej. 60"
                        >

                    </div>


                    <div class="input-group">

                        <label for="estatura">
                            Estatura (m)
                        </label>

                        <input
                            type="number"
                            id="estatura"
                            min="0.5"
                            max="2.5"
                            step="0.01"
                            placeholder="Ej. 1.70"
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="objetivo">
                        Objetivo
                    </label>

                    <select id="objetivo">

                        <option value="">
                            Selecciona un objetivo
                        </option>

                        <option value="Perder peso">
                            Perder peso
                        </option>

                        <option value="Ganar masa muscular">
                            Ganar masa muscular
                        </option>

                        <option value="Mejorar condición física">
                            Mejorar condición física
                        </option>

                        <option value="Mantener peso">
                            Mantener peso
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="save-button"
                >
                    GUARDAR CAMBIOS
                </button>

            </form>

        </section>



        <section class="options-section">

            <h2>Opciones</h2>


            <button
                type="button"
                class="option-button"
                id="logoutButton"
            >

                <span>↪</span>

                <div>

                    <strong>
                        Cerrar sesión
                    </strong>

                    <small>
                        Salir de tu cuenta
                    </small>

                </div>

            </button>

        </section>

    </main>


    <nav class="bottom-nav">

        <a
            href="/html/home.html"
            class="nav-item"
        >
            <span>⌂</span>
            <small>Inicio</small>
        </a>


        <a
            href="/html/routines.html"
            class="nav-item"
        >
            <span>🏋</span>
            <small>Rutinas</small>
        </a>


        <a
            href="/html/progress.html"
            class="nav-item"
        >
            <span>📊</span>
            <small>Progreso</small>
        </a>


        <a
            href="/html/profile.html"
            class="nav-item active"
        >
            <span>👤</span>
            <small>Perfil</small>
        </a>

    </nav>


    <script src="/js/profile.js"></script>

</body>

</html>
