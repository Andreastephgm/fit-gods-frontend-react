<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi progreso - FIT GODS</title>

    <link rel="stylesheet" href="/css/progress.css">
</head>

<body>

    <header class="top-header">

        <a href="/html/home.html" class="brand">

            <img
                src="/assets/logo.png"
                alt="Logo FIT GODS"
                class="header-logo"
            >

            <span>FIT GODS</span>

        </a>

    </header>


    <main class="progress-container">

        <section class="page-intro">

            <span class="section-label">
                SEGUIMIENTO
            </span>

            <h1>Mi progreso</h1>

            <p>
                Consulta tus avances y registra tus resultados.
            </p>

        </section>

        <section class="summary-grid">

            <article class="summary-card">

                <span class="summary-label">
                    PESO ACTUAL
                </span>

                <strong id="currentWeight">
                    60 kg
                </strong>

            </article>


            <article class="summary-card">

                <span class="summary-label">
                    AVANCE
                </span>

                <strong id="currentProgress">
                    65%
                </strong>

            </article>


            <article class="summary-card">

                <span class="summary-label">
                    REGISTROS
                </span>

                <strong id="recordCount">
                    0
                </strong>

            </article>

        </section>


        <section class="progress-section">

            <div class="section-title">

                <h2>Avance general</h2>

                <span id="progressPercentage">
                    65%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </section>


        <section class="register-progress">

            <h2>Registrar progreso</h2>

            <p>
                Agrega un nuevo registro de tu evolución.
            </p>


            <form id="progressForm">

                <div class="form-row">

                    <div class="input-group">

                        <label for="fecha">
                            Fecha
                        </label>

                        <input
                            type="date"
                            id="fecha"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="peso">
                            Peso (kg)
                        </label>

                        <input
                            type="number"
                            id="peso"
                            min="1"
                            max="300"
                            step="0.1"
                            placeholder="Ej. 60"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="avance">
                        Porcentaje de avance
                    </label>

                    <input
                        type="number"
                        id="avance"
                        min="0"
                        max="100"
                        placeholder="Ej. 70"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="observaciones">
                        Observaciones
                    </label>

                    <textarea
                        id="observaciones"
                        rows="3"
                        placeholder="Escribe cómo te fue..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="save-button"
                >
                    GUARDAR REGISTRO
                </button>

            </form>

        </section>


        <section class="history-section">

            <div class="section-title">

                <h2>Historial</h2>

            </div>


            <div id="historyContainer">

            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <a
            href="/html/home.html"
            class="nav-item"
        >
            <span>⌂</span>
            <small>Inicio</small>
        </a>


        <a
            href="/html/routines.html"
            class="nav-item"
        >
            <span>🏋</span>
            <small>Rutinas</small>
        </a>


        <a
            href="/html/progress.html"
            class="nav-item active"
        >
            <span>📊</span>
            <small>Progreso</small>
        </a>


        <a
            href="/html/profile.html"
            class="nav-item"
        >
            <span>👤</span>
            <small>Perfil</small>
        </a>

    </nav>


    <script src="/js/progress.js"></script>

</body>

</html>
