<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta - FIT GODS</title>

    <link rel="stylesheet" href="/css/register.css">

</head>


<body>

    <main class="register-container">

        <section class="register-card">


            <div class="logo-container">

                <img
                    src="/assets/logo.png"
                    alt="Logo de FIT GODS"
                    class="logo-image"
                >

                <h1>FIT GODS</h1>

                <p class="slogan">
                    SUPERA TUS LÍMITES
                </p>

            </div>


            <div class="register-content">

                <h2>Crear cuenta</h2>

                <p class="description">
                    Regístrate y comienza a trabajar en tus objetivos.
                </p>


                <form id="registerForm">


                    <div class="form-row">

                        <div class="input-group">

                            <label for="nombre">
                                Nombre
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="Tu nombre"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="apellido">
                                Apellido
                            </label>

                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                placeholder="Tu apellido"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="Ingresa tu correo"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Crea una contraseña"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="fechaNacimiento">
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            id="fechaNacimiento"
                            name="fechaNacimiento"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="input-group">

                            <label for="peso">
                                Peso (kg)
                            </label>

                            <input
                                type="number"
                                id="peso"
                                name="peso"
                                placeholder="Ej. 60"
                                min="1"
                                max="300"
                                step="0.1"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="estatura">
                                Estatura (m)
                            </label>

                            <input
                                type="number"
                                id="estatura"
                                name="estatura"
                                placeholder="Ej. 1.70"
                                min="0.5"
                                max="2.5"
                                step="0.01"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="objetivo">
                            Objetivo
                        </label>

                        <select
                            id="objetivo"
                            name="objetivo"
                            required
                        >

                            <option value="">
                                Selecciona tu objetivo
                            </option>

                            <option value="perder-peso">
                                Perder peso
                            </option>

                            <option value="ganar-musculo">
                                Ganar masa muscular
                            </option>

                            <option value="mantener">
                                Mantenerme en forma
                            </option>

                            <option value="resistencia">
                                Mejorar resistencia
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="register-button"
                    >
                        CREAR CUENTA
                    </button>

                </form>


                <p class="login-text">

                    ¿Ya tienes una cuenta?

                    <a href="/html/index.html">
                        Inicia sesión
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="/js/register.js"></script>

</body>

</html>
